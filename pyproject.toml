[project]
name = "yt-feed-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "minyeongg", email = "1030pmy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.5.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "google-api-python-client>=2.200.0",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.2",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp<2.0.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
yt-feed-agent = "ytfa.worker:main"
xba = "ytfa.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ytfa"
module-root = "server"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 프로젝트 루트를 import 경로에 넣는다 — eval/run_retrieval.py(server/ 밖,
# ytfa 패키지가 아니라 evaluation 스크립트) 테스트가 이걸 필요로 한다.
pythonpath = ["."]
