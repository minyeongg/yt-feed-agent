<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>YT Feed Agent</title>
    <style>
      * { box-sizing: border-box; }
      body {
        width: 360px;
        min-height: 240px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #202124;
        background: #fff;
      }
      header {
        padding: 10px 14px;
        border-bottom: 1px solid #eee;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #banner {
        display: none;
        padding: 10px 14px;
        background: #fdecea;
        color: #b3261e;
        font-size: 12px;
        line-height: 1.5;
      }
      #banner.show { display: block; }

      #token-setup { display: none; padding: 14px; flex-direction: column; gap: 8px; }
      #token-setup.show { display: flex; }
      #token-setup input {
        padding: 7px 9px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px;
      }
      #token-setup button {
        padding: 7px 9px; font-size: 12px; border: none; border-radius: 4px;
        background: #1a73e8; color: #fff; cursor: pointer;
      }
      .muted { color: #666; font-size: 11px; }

      #app { display: none; }
      #app.show { display: block; }

      #search-box { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; }
      #search-input {
        flex: 1; padding: 7px 9px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px;
      }
      #search-box button {
        padding: 7px 10px; font-size: 12px; border: none; border-radius: 4px;
        background: #1a73e8; color: #fff; cursor: pointer;
      }

      section { padding: 10px 14px; }
      section h2 { font-size: 12px; margin: 0 0 8px; color: #444; }

      .video-item { display: block; padding: 8px 0; border-bottom: 1px solid #f5f5f5; text-decoration: none; color: inherit; }
      .video-item:last-child { border-bottom: none; }
      .video-title { font-size: 13px; font-weight: 500; line-height: 1.35; }
      .video-summary { font-size: 11.5px; color: #666; margin-top: 3px; line-height: 1.4; }
      .video-reason { font-size: 11px; color: #1a73e8; margin-top: 3px; }

      #empty-state { padding: 20px 14px; text-align: center; color: #888; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <span>YT Feed Agent</span>
      <span>
        <span id="cost-hint" class="muted"></span>
        <button id="open-sidepanel-btn" title="에이전트와 대화" style="border:none;background:none;cursor:pointer;font-size:14px;">💬</button>
      </span>
    </header>
    <div id="banner"></div>

    <div id="token-setup">
      <div class="muted">서버 토큰을 입력하세요 (터미널에서 <code>cat config/token</code>)</div>
      <input id="token-input" type="text" placeholder="토큰 붙여넣기" autocomplete="off" />
      <button id="token-save">저장</button>
    </div>

    <div id="app">
      <div id="search-box">
        <input id="search-input" type="text" placeholder="검색어 입력" />
        <button id="search-btn">검색</button>
      </div>
      <section id="results-section"></section>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
