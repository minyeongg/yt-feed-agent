<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>YT Feed Agent — 대화</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #202124;
        background: #fff;
      }
      body { display: flex; flex-direction: column; }

      header {
        padding: 10px 14px;
        border-bottom: 1px solid #eee;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      header button {
        border: none; background: transparent; color: #888; cursor: pointer; font-size: 11px;
      }

      #banner {
        display: none;
        padding: 10px 14px;
        background: #fdecea;
        color: #b3261e;
        font-size: 12px;
        line-height: 1.5;
        flex-shrink: 0;
      }
      #banner.show { display: block; }

      #token-setup { display: none; padding: 14px; flex-direction: column; gap: 8px; }
      #token-setup.show { display: flex; }
      #token-setup input { padding: 7px 9px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
      #token-setup button {
        padding: 7px 9px; font-size: 12px; border: none; border-radius: 4px;
        background: #1a73e8; color: #fff; cursor: pointer;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg { max-width: 90%; line-height: 1.5; white-space: pre-wrap; }
      .msg.user { align-self: flex-end; background: #1a73e8; color: #fff; padding: 8px 11px; border-radius: 10px 10px 2px 10px; }
      .msg.assistant { align-self: flex-start; background: #f1f3f4; padding: 8px 11px; border-radius: 10px 10px 10px 2px; }
      .tool-note { align-self: flex-start; font-size: 11px; color: #888; padding: 0 4px; }

      #input-row { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid #eee; flex-shrink: 0; }
      #input-row textarea {
        flex: 1; resize: none; padding: 7px 9px; font-size: 12px; border: 1px solid #ccc;
        border-radius: 4px; font-family: inherit; height: 36px;
      }
      #input-row button {
        padding: 0 14px; font-size: 12px; border: none; border-radius: 4px;
        background: #1a73e8; color: #fff; cursor: pointer;
      }
      #input-row button:disabled { background: #ccc; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <span>에이전트와 대화</span>
      <button id="reset-btn">새 대화</button>
    </header>
    <div id="banner"></div>

    <div id="token-setup">
      <div>서버 토큰을 입력하세요 (터미널에서 <code>cat config/token</code>)</div>
      <input id="token-input" type="text" placeholder="토큰 붙여넣기" autocomplete="off" />
      <button id="token-save">저장</button>
    </div>

    <div id="messages"></div>
    <div id="input-row">
      <textarea id="chat-input" placeholder="메시지를 입력하세요..."></textarea>
      <button id="send-btn">전송</button>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
